<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Qix Reveal – Stable</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#000000">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: sans-serif;
      color: #fff;
    }

    #gameCanvas {
      display: block;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <img id="bgImage" src="level1.jpg" style="display:none;">

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    // --- LIVELLI ---
    const levels = [
      { name: "Level 1",  image: "level1.jpg",  target: 50 },
      { name: "Level 2",  image: "level2.jpg",  target: 55 },
      { name: "Level 3",  image: "level3.jpg",  target: 60 },
      { name: "Level 4",  image: "level4.jpg",  target: 65 },
      { name: "Level 5",  image: "level5.jpg",  target: 70 },
      { name: "Level 6",  image: "level6.jpg",  target: 72 },
      { name: "Level 7",  image: "level7.jpg",  target: 75 },
      { name: "Level 8",  image: "level8.jpg",  target: 78 },
      { name: "Level 9",  image: "level9.jpg",  target: 80 },
      { name: "Level 10", image: "level10.jpg", target: 85 }
    ];

    let currentLevelIndex = 0;
    let targetPercent = levels[currentLevelIndex].target;

    // --- AREA DI GIOCO ---
    const margin = 30;
    const playX = margin;
    const playY = margin;
    const playWidth = WIDTH - margin * 2;
    const playHeight = HEIGHT - margin * 2;

    // --- CELLE ---
    const CELL_SAFE = 0;
    const CELL_UNCLAIMED = 1;
    const CELL_TRAIL = 2;

    const cellSize = 6;
    const cols = Math.floor(playWidth / cellSize);
    const rows = Math.floor(playHeight / cellSize);

    let grid = [];

    // --- PLAYER ---
    const player = {
      x: 0,
      y: 0,
      size: 12,
      speed: 3.6,
      vx: 0,
      vy: 0
    };

    // --- NEMICO (RAGNO SEMPRE) ---
    const enemy = {
      x: 0,
      y: 0,
      size: 18,
      vx: 0,
      vy: 0,
      speed: 2,
      changeDirTimer: 0,
      shootCooldown: 0
    };

    let bullets = [];

    function setRandomEnemyDirection() {
      const angle = Math.random() * Math.PI * 2;
      enemy.vx = Math.cos(angle) * enemy.speed;
      enemy.vy = Math.sin(angle) * enemy.speed;
    }

    // --- CONTROLLI ---
    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false
    };

    window.addEventListener("keydown", (e) => {
      if (keys.hasOwnProperty(e.key)) {
        keys[e.key] = true;
      }
      if (levelComplete && (e.key === " " || e.key === "Enter")) {
        goToNextLevel();
      } else if ((gameOver || allLevelsComplete) && e.key === "Enter") {
        restartGame();
      }
    });

    window.addEventListener("keyup", (e) => {
      if (keys.hasOwnProperty(e.key)) {
        keys[e.key] = false;
      }
    });

    // TOUCH
    let touchActive = false;
    let touchX = 0;
    let touchY = 0;

    function updateTouchPosition(evt) {
      const rect = canvas.getBoundingClientRect();
      const t = evt.touches[0];
      touchX = t.clientX - rect.left;
      touchY = t.clientY - rect.top;
    }

    canvas.addEventListener("touchstart", (evt) => {
      evt.preventDefault();
      if (levelComplete) { goToNextLevel(); return; }
      if (gameOver || allLevelsComplete) { restartGame(); return; }
      touchActive = true;
      updateTouchPosition(evt);
    }, { passive: false });

    canvas.addEventListener("touchmove", (evt) => {
      evt.preventDefault();
      updateTouchPosition(evt);
    }, { passive: false });

    canvas.addEventListener("touchend", (evt) => {
      evt.preventDefault();
      touchActive = false;
    }, { passive: false });

    canvas.addEventListener("mousedown", () => {
      if (levelComplete) goToNextLevel();
      else if (gameOver || allLevelsComplete) restartGame();
    });

    // --- AUDIO ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      return audioCtx;
    }

    function playBeep(freq, duration, type = "square", volume = 0.08) {
      const ctxA = getAudioContext();
      if (!ctxA) return;
      const osc = ctxA.createOscillator();
      const gain = ctxA.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;
      osc.connect(gain);
      gain.connect(ctxA.destination);
      osc.start();
      osc.stop(ctxA.currentTime + duration);
    }

    function playCaptureSound()       { playBeep(750, 0.08, "square", 0.09); }
    function playHitSound()           { playBeep(160, 0.20, "sawtooth", 0.16); }
    function playLevelCompleteSound() {
      playBeep(650, 0.09, "square", 0.1);
      setTimeout(() => playBeep(900, 0.15, "triangle", 0.12), 120);
    }
    function playShootSound()         { playBeep(420, 0.05, "square", 0.07); }

    // --- SFONDO ---
    const bg = document.getElementById("bgImage");
    let bgLoaded = false;

    function setBackgroundForCurrentLevel() {
      const cfg = levels[currentLevelIndex];
      targetPercent = cfg.target;
      bgLoaded = false;
      bg.src = cfg.image;
      bg.onload = () => { bgLoaded = true; };
      bg.onerror = () => { bgLoaded = false; };
    }

    // --- STATO GIOCO ---
    let isDrawing = false;
    let lives = 3;
    let gameOver = false;
    let levelComplete = false;
    let allLevelsComplete = false;
    let revealPercent = 0;
    let playedLevelCompleteSound = false;

    // --- GRIGLIA ---
    function initGrid() {
      grid = [];
      for (let y = 0; y < rows; y++) {
        grid[y] = [];
        for (let x = 0; x < cols; x++) {
          grid[y][x] = CELL_UNCLAIMED;
        }
      }
      for (let x = 0; x < cols; x++) {
        grid[0][x] = CELL_SAFE;
        grid[rows - 1][x] = CELL_SAFE;
      }
      for (let y = 0; y < rows; y++) {
        grid[y][0] = CELL_SAFE;
        grid[y][cols - 1] = CELL_SAFE;
      }
    }

    function gridToWorld(col, row) {
      const x = playX + col * cellSize + cellSize / 2;
      const y = playY + row * cellSize + cellSize / 2;
      return { x, y };
    }

    function worldToGrid(x, y) {
      let gx = x - playX;
      let gy = y - playY;
      let col = Math.floor(gx / cellSize);
      let row = Math.floor(gy / cellSize);
      if (col < 0) col = 0;
      if (row < 0) row = 0;
      if (col >= cols) col = cols - 1;
      if (row >= rows) row = rows - 1;
      return { col, row };
    }

    function computeRevealPercent() {
      let safeCount = 0;
      let total = rows * cols;
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (grid[y][x] === CELL_SAFE) safeCount++;
        }
      }
      return (safeCount / total) * 100;
    }

    function placePlayer() {
      const row = rows - 1;
      const col = Math.floor(cols / 2);
      const pos = gridToWorld(col, row);
      player.x = pos.x;
      player.y = pos.y;
      player.vx = 0;
      player.vy = 0;
    }

    function placeEnemy() {
      const row = Math.floor(rows / 2);
      const col = Math.floor(cols / 2);
      const pos = gridToWorld(col, row);
      enemy.x = pos.x;
      enemy.y = pos.y;

      const lvl = currentLevelIndex;
      enemy.speed = 1.4 + lvl * 0.25;      // ragno più veloce a ogni livello
      enemy.changeDirTimer = 0;
      enemy.shootCooldown = getShootCooldownForLevel(lvl);
      setRandomEnemyDirection();
    }

    function getShootCooldownForLevel(lvl) {
      // level 1 = più lento, poi sempre più spesso
      let baseMin = 170 - lvl * 12;
      const range = 70;
      if (baseMin < 55) baseMin = 55;
      return baseMin + Math.random() * range;
    }

    function initLevel() {
      setBackgroundForCurrentLevel();
      initGrid();
      placePlayer();
      placeEnemy();
      bullets = [];
      isDrawing = false;
      gameOver = false;
      levelComplete = false;
      allLevelsComplete = false;
      lives = 3;
      revealPercent = computeRevealPercent();
      playedLevelCompleteSound = false;
    }

    function restartGame() {
      currentLevelIndex = 0;
      gameOver = false;
      allLevelsComplete = false;
      initLevel();
    }

    // --- VITE ---
    function loseLife() {
      playHitSound();
      lives--;
      if (lives <= 0) {
        gameOver = true;
      } else {
        initGrid();
        placePlayer();
        placeEnemy();
        bullets = [];
        isDrawing = false;
        revealPercent = computeRevealPercent();
      }
    }

    // --- LIVELLI ---
    function goToNextLevel() {
      if (currentLevelIndex < levels.length - 1) {
        currentLevelIndex++;
        initLevel();
      } else {
        allLevelsComplete = true;
        levelComplete = false;
      }
    }

    // --- FLOOD FILL / CATTURA AREA ---
    function closeLoopAndCapture() {
      playCaptureSound();

      const visited = [];
      for (let y = 0; y < rows; y++) {
        visited[y] = [];
        for (let x = 0; x < cols; x++) {
          visited[y][x] = false;
        }
      }

      const enemyCell = worldToGrid(enemy.x, enemy.y);
      const queue = [];
      queue.push({ row: enemyCell.row, col: enemyCell.col });
      visited[enemyCell.row][enemyCell.col] = true;

      const dirs = [
        { dx: 1, dy: 0 },
        { dx: -1, dy: 0 },
        { dx: 0, dy: 1 },
        { dx: 0, dy: -1 }
      ];

      while (queue.length > 0) {
        const { row, col } = queue.shift();
        for (let i = 0; i < 4; i++) {
          const nx = col + dirs[i].dx;
          const ny = row + dirs[i].dy;
          if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
          if (visited[ny][nx]) continue;
          const state = grid[ny][nx];
          if (state === CELL_SAFE) continue;
          visited[ny][nx] = true;
          queue.push({ row: ny, col: nx });
        }
      }

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const state = grid[y][x];
          if (state === CELL_SAFE) continue;
          if (!visited[y][x]) {
            grid[y][x] = CELL_SAFE;
          } else if (state === CELL_TRAIL) {
            grid[y][x] = CELL_SAFE;
          }
        }
      }

      // pulizia isolette
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (grid[y][x] === CELL_UNCLAIMED) {
            let allSafeAround = true;
            const dirs2 = [
              { dx: 1, dy: 0 },
              { dx: -1, dy: 0 },
              { dx: 0, dy: 1 },
              { dx: 0, dy: -1 }
            ];
            for (let i = 0; i < 4; i++) {
              const nx = x + dirs2[i].dx;
              const ny = y + dirs2[i].dy;
              if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
              if (grid[ny][nx] !== CELL_SAFE) {
                allSafeAround = false;
                break;
              }
            }
            if (allSafeAround) grid[y][x] = CELL_SAFE;
          }
        }
      }

      revealPercent = computeRevealPercent();
      if (revealPercent >= targetPercent) {
        levelComplete = true;
        if (!playedLevelCompleteSound) {
          playLevelCompleteSound();
          playedLevelCompleteSound = true;
        }
      }
    }

    // --- UPDATE PLAYER ---
    function updatePlayer() {
      if (gameOver || levelComplete || allLevelsComplete) return;

      let vx = 0, vy = 0;

      if (touchActive) {
        const dx = touchX - player.x;
        const dy = touchY - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 4) {
          vx = dx / dist;
          vy = dy / dist;
        }
      } else {
        if (keys.ArrowLeft) vx -= 1;
        if (keys.ArrowRight) vx += 1;
        if (keys.ArrowUp) vy -= 1;
        if (keys.ArrowDown) vy += 1;
        const len = Math.hypot(vx, vy);
        if (len > 0) { vx /= len; vy /= len; }
      }

      player.vx = vx * player.speed;
      player.vy = vy * player.speed;

      player.x += player.vx;
      player.y += player.vy;

      if (player.x < playX + player.size / 2) player.x = playX + player.size / 2;
      if (player.x > playX + playWidth - player.size / 2) player.x = playX + playWidth - player.size / 2;
      if (player.y < playY + player.size / 2) player.y = playY + player.size / 2;
      if (player.y > playY + playHeight - player.size / 2) player.y = playY + playHeight - player.size / 2;

      const cell = worldToGrid(player.x, player.y);
      const state = grid[cell.row][cell.col];

      if (state === CELL_SAFE) {
        if (isDrawing) {
          isDrawing = false;
          closeLoopAndCapture();
        }
      } else if (state === CELL_UNCLAIMED) {
        isDrawing = true;
        grid[cell.row][cell.col] = CELL_TRAIL;
      } else if (state === CELL_TRAIL) {
        isDrawing = true;
      }
    }

    // --- SPARO RAGNO ---
    function shootBulletAtPlayer() {
      const dx = player.x - enemy.x;
      const dy = player.y - enemy.y;
      const dist = Math.hypot(dx, dy) || 1;

      const lvl = currentLevelIndex;
      const bulletSpeed = 2.5 + lvl * 0.35;

      const vx = (dx / dist) * bulletSpeed;
      const vy = (dy / dist) * bulletSpeed;
      bullets.push({ x: enemy.x, y: enemy.y, vx, vy, radius: 4 });
      playShootSound();
    }

    function updateBullets() {
      if (gameOver || levelComplete || allLevelsComplete) return;

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (b.x < playX || b.x > playX + playWidth ||
            b.y < playY || b.y > playY + playHeight) {
          bullets.splice(i, 1);
          continue;
        }

        const cell = worldToGrid(b.x, b.y);
        if (grid[cell.row][cell.col] === CELL_TRAIL) {
          bullets.splice(i, 1);
          loseLife();
          continue;
        }

        const distP = Math.hypot(b.x - player.x, b.y - player.y);
        if (distP < b.radius + player.size / 2) {
          bullets.splice(i, 1);
          loseLife();
          continue;
        }
      }
    }

    // --- UPDATE NEMICO (ragno) ---
    function updateEnemy() {
      if (gameOver || levelComplete || allLevelsComplete) return;

      const lvl = currentLevelIndex;

      enemy.changeDirTimer--;
      if (enemy.changeDirTimer <= 0) {
        setRandomEnemyDirection();
        enemy.changeDirTimer = 60 + Math.random() * 120;
      }

      enemy.shootCooldown--;
      if (enemy.shootCooldown <= 0) {
        shootBulletAtPlayer();
        enemy.shootCooldown = getShootCooldownForLevel(lvl);
      }

      let nextX = enemy.x + enemy.vx;
      let nextY = enemy.y + enemy.vy;

      if (nextX < playX + enemy.size / 2 || nextX > playX + playWidth - enemy.size / 2) {
        enemy.vx *= -1;
        nextX = enemy.x + enemy.vx;
      }
      if (nextY < playY + enemy.size / 2 || nextY > playY + playHeight - enemy.size / 2) {
        enemy.vy *= -1;
        nextY = enemy.y + enemy.vy;
      }

      const cell = worldToGrid(nextX, nextY);
      if (grid[cell.row][cell.col] === CELL_SAFE) {
        enemy.vx *= -1;
        enemy.vy *= -1;
        nextX = enemy.x + enemy.vx;
        nextY = enemy.y + enemy.vy;
      }

      enemy.x = nextX;
      enemy.y = nextY;

      const cellNow = worldToGrid(enemy.x, enemy.y);
      if (grid[cellNow.row][cellNow.col] === CELL_TRAIL) {
        loseLife();
        return;
      }

      const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
      if (dist < (enemy.size + player.size) * 0.5) {
        loseLife();
        return;
      }
    }

    function update() {
      updatePlayer();
      updateEnemy();
      updateBullets();
    }

function draw() {
  // 👉 SE IL LIVELLO È COMPLETATO: mostra SOLO l'immagine intera
  if (levelComplete) {
    if (bgLoaded) {
      ctx.drawImage(bg, 0, 0, WIDTH, HEIGHT);
    } else {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
    }

    // leggero scurimento per rendere il testo leggibile
    ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // testo centrale
    ctx.fillStyle = "lime";
    ctx.font = "40px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("LEVEL COMPLETE!", WIDTH / 2, HEIGHT / 2 - 20);

    ctx.fillStyle = "#ffffff";
    ctx.font = "22px sans-serif";
    ctx.fillText("Tap / Enter per continuare", WIDTH / 2, HEIGHT / 2 + 20);

    return; // 🔥 importantissimo: NON disegnare il resto
  }

  // SFONDO (se il livello NON è completato)
  if (bgLoaded) ctx.drawImage(bg, 0, 0, WIDTH, HEIGHT);
  else { ctx.fillStyle = "#222"; ctx.fillRect(0, 0, WIDTH, HEIGHT); }

  // scurisco fuori area
  ctx.fillStyle = "rgba(0,0,0,0.85)";
  ctx.fillRect(0, 0, WIDTH, playY);
  ctx.fillRect(0, playY + playHeight, WIDTH, HEIGHT - (playY + playHeight));
  ctx.fillRect(0, playY, playX, playHeight);
  ctx.fillRect(playX + playWidth, playY, WIDTH - (playX + playWidth), playHeight);

  // celle (blocchi + trail)
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const state = grid[y][x];
      const px = playX + x * cellSize;
      const py = playY + y * cellSize;
      if (state === CELL_UNCLAIMED) {
        ctx.fillStyle = "black";
        ctx.fillRect(px, py, cellSize, cellSize);
      } else if (state === CELL_TRAIL) {
        ctx.fillStyle = "rgba(0,180,255,0.8)";
        ctx.fillRect(px, py, cellSize, cellSize);
      }
    }
  }

  // ragno nemico
  ctx.save();
  ctx.translate(enemy.x, enemy.y);
  ctx.fillStyle = "#00ff99";
  ctx.beginPath();
  ctx.arc(0, 0, enemy.size / 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#003322";
  ctx.lineWidth = 2;
  ctx.beginPath();
  const legLen = enemy.size;
  ctx.moveTo(-3, -enemy.size / 4); ctx.lineTo(-legLen, -legLen / 2);
  ctx.moveTo(3, -enemy.size / 4);  ctx.lineTo(legLen, -legLen / 2);
  ctx.moveTo(-3, 0);               ctx.lineTo(-legLen, 0);
  ctx.moveTo(3, 0);                ctx.lineTo(legLen, 0);
  ctx.moveTo(-3, enemy.size / 4);  ctx.lineTo(-legLen, legLen / 2);
  ctx.moveTo(3, enemy.size / 4);   ctx.lineTo(legLen, legLen / 2);
  ctx.stroke();
  ctx.restore();

  // player
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2);
  ctx.fill();

  // proiettili
  ctx.fillStyle = "orange";
  for (const b of bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // cornice area
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 3;
  ctx.strokeRect(playX, playY, playWidth, playHeight);

  // ===== HUD =====
  const hudHeight = 70;
  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.fillRect(0, 0, WIDTH, hudHeight);

  // LEVEL + cuori
  ctx.fillStyle = "#00e0ff";
  ctx.font = "16px sans-serif";
  const levelIndexText = "LEVEL " + (currentLevelIndex + 1) + " / " + levels.length;
  ctx.textAlign = "left";
  ctx.fillText(levelIndexText, 14, 24);
  const levelTextWidth = ctx.measureText(levelIndexText).width;

  // CUORI GRANDI allineati
  const heartSize = 16;
  const heartY = 9;
  let heartX = 14 + levelTextWidth + 30;

  ctx.fillStyle = "#ff2222";
  ctx.strokeStyle = "#660000";
  ctx.lineWidth = 1.8;

  for (let i = 0; i < lives; i++) {
    ctx.beginPath();
    ctx.moveTo(heartX, heartY + heartSize * 0.3);
    ctx.bezierCurveTo(
      heartX - heartSize, heartY - heartSize * 0.2,
      heartX - heartSize, heartY + heartSize,
      heartX, heartY + heartSize
    );
    ctx.bezierCurveTo(
      heartX + heartSize, heartY + heartSize,
      heartX + heartSize, heartY - heartSize * 0.2,
      heartX, heartY + heartSize * 0.3
    );
    ctx.fill();
    ctx.stroke();
    heartX += heartSize * 2.3;
  }

  // NOME LIVELLO
  ctx.fillStyle = "#ffd700";
  ctx.font = "22px sans-serif";
  const nameText = levels[currentLevelIndex].name;
  const nameWidth = ctx.measureText(nameText).width;
  ctx.fillText(nameText, WIDTH / 2 - nameWidth / 2, 28);

  // INFO PROGRESS
  ctx.fillStyle = "#ffffff";
  ctx.font = "14px sans-serif";
  const infoText = "Revealed " + revealPercent.toFixed(1) + "%  |  Target " + targetPercent + "%";
  const infoWidth = ctx.measureText(infoText).width;
  ctx.fillText(infoText, WIDTH / 2 - infoWidth / 2, 48);

  // BARRA PROGRESSO
  const barWidth = 260;
  const barHeight = 10;
  const barX = WIDTH / 2 - barWidth / 2;
  const barY = 53;

  const bgGrad = ctx.createLinearGradient(barX, barY, barX + barWidth, barY);
  bgGrad.addColorStop(0, "rgba(255,255,255,0.15)");
  bgGrad.addColorStop(1, "rgba(80,80,80,0.3)");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(barX, barY, barWidth, barHeight);

  const progressRatio = Math.min(revealPercent / targetPercent, 1);
  const progGrad = ctx.createLinearGradient(barX, barY, barX + barWidth, barY);
  if (progressRatio < 0.5) {
    progGrad.addColorStop(0, "#ff4444");
    progGrad.addColorStop(1, "#ffaa00");
  } else {
    progGrad.addColorStop(0, "#44ff44");
    progGrad.addColorStop(1, "#88ffcc");
  }
  ctx.fillStyle = progGrad;
  ctx.fillRect(barX, barY, barWidth * progressRatio, barHeight);

  ctx.strokeStyle = "rgba(0,0,0,0.9)";
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barWidth, barHeight);
  // ===== FINE HUD =====

  // OVERLAY GAME OVER / ALL LEVELS COMPLETE
  ctx.textAlign = "left"; // per non incasinare altri testi dopo
  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = "red";
    ctx.font = "32px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", WIDTH / 2, HEIGHT / 2);
    ctx.font = "18px sans-serif";
    ctx.fillText("ENTER / TAP per ricominciare dal Level 1",
                 WIDTH / 2, HEIGHT / 2 + 30);
  } else if (allLevelsComplete) {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = "cyan";
    ctx.font = "32px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("ALL LEVELS COMPLETE!", WIDTH / 2, HEIGHT / 2);
    ctx.font = "18px sans-serif";
    ctx.fillText("ENTER / TAP per ricominciare dal Level 1",
                 WIDTH / 2, HEIGHT / 2 + 30);
  }

  // reset textAlign di default
  ctx.textAlign = "left";
}



    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initLevel();
    loop();
  </script>
